name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'src/content/docs/**'
      - 'public/docs/**'
  workflow_dispatch:

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Announce on Discord
        if: github.event_name == 'push'
        run: python3 .github/scripts/docs-discord.py "${{ github.event.before }}" "${{ github.sha }}" "${{ github.actor }}"
        env:
          DOCS_DISCORD_WEBHOOK: ${{ secrets.DOCS_DISCORD_WEBHOOK }}
